name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare app token
        shell: bash
        env:
          API_TOKEN: ${{ secrets.TASK_TRACKER_API_TOKEN }}
        run: |
          if [ -z "$API_TOKEN" ]; then
            echo "::error::TASK_TRACKER_API_TOKEN secret is missing"
            exit 1
          fi
          sed "s/__API_TOKEN__/$API_TOKEN/g" app/src/main/assets/app.template.js > app/src/main/assets/app.js

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "::error::Build did not produce a valid APK!"
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: task-tracker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14