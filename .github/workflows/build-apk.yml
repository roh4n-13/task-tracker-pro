
name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Prepare app token
        env:
          API_TOKEN: ${{ secrets.TASK_TRACKER_API_TOKEN }}
        run: |
          if [ -z "$API_TOKEN" ]; then
            echo "::error::GitHub Secret TASK_TRACKER_API_TOKEN is missing"
            exit 1
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path

          assets = Path("app/src/main/assets")
          template = assets / "app.template.js"
          output = assets / "app.js"

          content = template.read_text(encoding="utf-8")
          if '"__API_TOKEN__"' not in content:
              raise SystemExit("Token placeholder not found in template")

          token = os.environ["API_TOKEN"]
          output.write_text(
              content.replace('"__API_TOKEN__"', '"' + token + '"'),
              encoding="utf-8"
          )
          print("app.js generated for this build.")
          PY

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "::error::Build did not produce a valid APK!"
            exit 1
          fi
          echo "APK successfully built."
          ls -lh "$APK_PATH"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: task-tracker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
